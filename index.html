<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>karigai · wellness, attuned</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#FAF6EF;font-family:'Geist',system-ui,sans-serif;color:#1F1B16;min-height:100vh}
button{cursor:pointer;font-family:inherit}
::-webkit-scrollbar{width:0;height:0}

.site-header{
  height:52px;border-bottom:1px solid #E5DCCB;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;background:rgba(250,246,239,0.95);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:200;
}
.nav-pills{display:flex;gap:4px}
.nav-pill{
  padding:5px 14px;border-radius:8px;border:1px solid transparent;
  background:transparent;font-size:12.5px;font-weight:500;color:#7A7066;
  transition:all .12s;letter-spacing:0.01em;
}
.nav-pill:hover{background:#EFE7DA;color:#1F1B16}
.nav-pill.on{background:#1F1B16;color:#F5EFE6}

.screen-selector{
  display:flex;gap:5px;flex-wrap:wrap;justify-content:center;
  padding:14px 20px 0;
}
.screen-pill{
  padding:4px 11px;border-radius:7px;border:1px solid #E5DCCB;
  background:#fff;font-family:'Geist Mono',monospace;font-size:9.5px;
  letter-spacing:0.1em;text-transform:uppercase;color:#7A7066;
  transition:all .12s;
}
.screen-pill:hover{background:#EFE7DA;color:#1F1B16;border-color:#D9CDB4}
.screen-pill.on{background:#1F1B16;color:#F5EFE6;border-color:#1F1B16}

.phone-stage{
  display:flex;justify-content:center;align-items:flex-start;
  padding:24px 20px 40px;
}
.phone-shell{
  background:#1A1814;border-radius:50px;padding:13px;
  box-shadow:0 50px 100px rgba(0,0,0,.28),0 20px 40px rgba(0,0,0,.18),
             inset 0 0 0 1px rgba(255,255,255,.07);
}
.phone-body{
  width:390px;height:844px;border-radius:38px;
  overflow:hidden;position:relative;
  display:flex;flex-direction:column;background:#FAF6EF;
}
.screen-scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
.screen-scroll::-webkit-scrollbar{width:0}

.admin-view{min-height:calc(100vh - 52px);overflow-x:auto;background:#FAF6EF}

@media(max-width:500px){
  .phone-shell{border-radius:0;padding:0;box-shadow:none}
  .phone-body{width:100vw;height:100dvh;border-radius:0}
  .site-header,.screen-selector{display:none}
  .phone-stage{padding:0}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState } = React;

// ── Brand tokens ─────────────────────────────────────────────
const KG = {
  cream:'#F5EFE6', paper:'#FAF6EF', card:'#FFFFFF', shell:'#EFE7DA',
  ink:'#1F1B16', ink2:'#3A332B', muted:'#7A7066', hairline:'#E5DCCB',
  clay:'#B8704F', claySoft:'#E9C8B5', sage:'#7A8B6F', sageSoft:'#CFD4C3',
  bone:'#E8DCC8', blush:'#E8B4A8', alert:'#C25450', amber:'#C99356',
  inkDeep:'#0F0E0C', inkSurf:'#1A1814', inkLine:'#2A2620',
};
const KGFont = {
  display:'"Instrument Serif","Cormorant Garamond",Georgia,serif',
  body:'"Geist","Inter",-apple-system,system-ui,sans-serif',
  mono:'"Geist Mono","JetBrains Mono",ui-monospace,monospace',
};

// ── Icons ─────────────────────────────────────────────────────
const Icon = ({ d, size=20, color='currentColor', sw=1.6, fill }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill||'none'}
    stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
    {typeof d==='string'?<path d={d}/>:d}
  </svg>
);
const Icons = {
  home:   <><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z"/></>,
  cycle:  <><circle cx="12" cy="12" r="8"/><path d="M12 4v4M16 8l-2 2"/></>,
  meal:   <><path d="M5 3v8a3 3 0 003 3v7M8 3v6M11 3v6"/><path d="M16 3c2 0 3 2 3 5s-1 5-3 5v8"/></>,
  dumbbell:<><path d="M3 9v6M6 6v12M10 9v6M14 9v6M18 6v12M21 9v6M10 12h4"/></>,
  spark:  <><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></>,
  user:   <><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></>,
  drop:   <><path d="M12 3c-4 5-6 8-6 11a6 6 0 0012 0c0-3-2-6-6-11z"/></>,
  bolt:   <><path d="M13 3L5 13h6l-1 8 8-10h-6l1-8z"/></>,
  moon:   <><path d="M21 13a9 9 0 11-10-10 7 7 0 0010 10z"/></>,
  shield: <><path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6l8-3z"/></>,
  bell:   <><path d="M6 16V11a6 6 0 0112 0v5l2 2H4l2-2zM10 20a2 2 0 004 0"/></>,
  chat:   <><path d="M4 5h16v11H8l-4 4z"/></>,
  chart:  <><path d="M4 20V4M4 20h16M8 16V10M12 16V6M16 16V12M20 16V8"/></>,
  device: <><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></>,
  check:  <><path d="M5 12l5 5L20 6"/></>,
  plus:   <><path d="M12 5v14M5 12h14"/></>,
  arrow:  <><path d="M5 12h14M13 5l7 7-7 7"/></>,
  back:   <><path d="M19 12H5M11 5l-7 7 7 7"/></>,
  search: <><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></>,
  menu:   <><path d="M4 7h16M4 12h16M4 17h16"/></>,
  alert:  <><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></>,
  filter: <><path d="M3 5h18M6 12h12M10 19h4"/></>,
  flag:   <><path d="M5 3v18M5 4h12l-2 4 2 4H5"/></>,
  lock:   <><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></>,
  download:<><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></>,
  trash:  <><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></>,
  close:  <><path d="M6 6l12 12M18 6L6 18"/></>,
  more:   <><circle cx="6" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="18" cy="12" r="1.2" fill="currentColor"/></>,
  history:<><path d="M3 12a9 9 0 109-9 9 9 0 00-7 4M3 4v4h4M12 7v5l3 2"/></>,
  edit:   <><path d="M4 20h4l11-11-4-4L4 16zM14 6l4 4"/></>,
  star:   <><path d="M12 3l3 6 6 1-4.5 4.5L18 21l-6-3-6 3 1.5-6.5L3 10l6-1z"/></>,
  flame:  <><path d="M12 3c2 4 6 6 6 11a6 6 0 01-12 0c0-3 2-4 3-6 1 2 2 3 3 0 0-2 0-3 0-5z"/></>,
};

// ── Primitives ────────────────────────────────────────────────
function KCard({ children, style, pad=18, dark, ...rest }) {
  return (
    <div {...rest} style={{
      background: dark ? KG.inkSurf : KG.card,
      border: `1px solid ${dark ? KG.inkLine : KG.hairline}`,
      borderRadius:18, padding:pad, ...style,
    }}>{children}</div>
  );
}

function KChip({ children, tone='neutral', style }) {
  const tones = {
    neutral:{ bg:KG.shell,     fg:KG.ink2,   bd:KG.hairline },
    sage:   { bg:'#E5EBDD',    fg:'#3F4D38',  bd:'#CFD4C3' },
    clay:   { bg:'#F4DCCD',    fg:'#6E3D24',  bd:'#E9C8B5' },
    blush:  { bg:'#F7DDD6',    fg:'#7E3A30',  bd:'#E8B4A8' },
    bone:   { bg:KG.bone,      fg:KG.ink2,   bd:'#D8C8AE' },
    alert:  { bg:'#F2D7D5',    fg:'#7A2522',  bd:'#E2A9A4' },
    ink:    { bg:KG.ink,       fg:KG.cream,  bd:KG.ink },
  };
  const t = tones[tone]||tones.neutral;
  return (
    <span style={{
      display:'inline-flex',alignItems:'center',gap:6,
      background:t.bg,color:t.fg,border:`1px solid ${t.bd}`,
      borderRadius:999,padding:'4px 10px',
      fontFamily:KGFont.body,fontSize:11,fontWeight:500,letterSpacing:'0.02em',...style,
    }}>{children}</span>
  );
}

function KRing({ value=0.6, size=56, stroke=5, color=KG.clay, track=KG.shell, label, sublabel }) {
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return (
    <div style={{ position:'relative',width:size,height:size,display:'inline-flex',alignItems:'center',justifyContent:'center' }}>
      <svg width={size} height={size} style={{ transform:'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} stroke={track} strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} strokeLinecap="round"
                fill="none" strokeDasharray={c} strokeDashoffset={c*(1-value)}/>
      </svg>
      {(label||sublabel)&&(
        <div style={{ position:'absolute',textAlign:'center',lineHeight:1.1 }}>
          {label&&<div style={{ fontFamily:KGFont.body,fontSize:size>80?18:12,fontWeight:600,color:KG.ink }}>{label}</div>}
          {sublabel&&<div style={{ fontFamily:KGFont.mono,fontSize:8,color:KG.muted,letterSpacing:'0.1em',textTransform:'uppercase' }}>{sublabel}</div>}
        </div>
      )}
    </div>
  );
}

function KPlaceholder({ w='100%', h=120, label='image', dark, style }) {
  const stripe = dark?'rgba(255,255,255,0.04)':'rgba(31,27,22,0.05)';
  return (
    <div style={{
      width:w, height:h, borderRadius:12,
      background:`repeating-linear-gradient(135deg,${stripe} 0 6px,transparent 6px 12px),${dark?KG.inkSurf:KG.shell}`,
      border:`1px solid ${dark?KG.inkLine:KG.hairline}`,
      display:'flex',alignItems:'center',justifyContent:'center',
      color:dark?'#9C9384':KG.muted,
      fontFamily:KGFont.mono,fontSize:10,letterSpacing:'0.16em',textTransform:'uppercase',...style,
    }}>{label}</div>
  );
}

function KEyebrow({ children, color=KG.muted }) {
  return <div style={{ fontFamily:KGFont.mono,fontSize:10,letterSpacing:'0.2em',textTransform:'uppercase',color }}>{children}</div>;
}

function KStat({ value, unit, label, sub, color=KG.ink }) {
  return (
    <div>
      <div style={{ display:'flex',alignItems:'baseline',gap:4,color }}>
        <span style={{ fontFamily:KGFont.display,fontSize:36,fontWeight:400,letterSpacing:'-0.02em' }}>{value}</span>
        {unit&&<span style={{ fontFamily:KGFont.mono,fontSize:11,color:KG.muted,letterSpacing:'0.1em' }}>{unit}</span>}
      </div>
      {label&&<div style={{ fontFamily:KGFont.body,fontSize:12,color:KG.ink2,marginTop:2 }}>{label}</div>}
      {sub&&<div style={{ fontFamily:KGFont.mono,fontSize:9.5,color:KG.muted,letterSpacing:'0.12em',textTransform:'uppercase',marginTop:3 }}>{sub}</div>}
    </div>
  );
}

function KSafetyBanner({ tone='info', title, body, style }) {
  const palette = {
    info:  { bg:'#EFE9DC', bd:'#D9CDB4', fg:KG.ink2,   accent:KG.clay },
    warn:  { bg:'#F4E4D5', bd:'#E2C9AB', fg:'#5A3A1F',  accent:KG.amber },
    alert: { bg:'#F2D7D5', bd:'#E2A9A4', fg:'#5C1F1C',  accent:KG.alert },
  }[tone];
  return (
    <div style={{ background:palette.bg,border:`1px solid ${palette.bd}`,borderRadius:14,padding:14,display:'flex',gap:12,...style }}>
      <div style={{ width:3,alignSelf:'stretch',background:palette.accent,borderRadius:99 }}/>
      <div>
        <div style={{ fontFamily:KGFont.body,fontSize:12,fontWeight:600,color:palette.fg,marginBottom:2 }}>{title}</div>
        <div style={{ fontFamily:KGFont.body,fontSize:11.5,color:palette.fg,opacity:0.85,lineHeight:1.4 }}>{body}</div>
      </div>
    </div>
  );
}

function KarigaiMark({ size=28, color=KG.ink }) {
  return (
    <svg width={size} height={size} viewBox="0 0 28 28" fill="none">
      <path d="M7 4 V24" stroke={color} strokeWidth="2" strokeLinecap="round"/>
      <path d="M7 14 C 14 14, 18 9, 21 4" stroke={color} strokeWidth="2" strokeLinecap="round" fill="none"/>
      <path d="M7 14 C 14 14, 18 19, 21 24" stroke={color} strokeWidth="2" strokeLinecap="round" fill="none"/>
      <circle cx="22.5" cy="4" r="1.4" fill={color}/>
    </svg>
  );
}

function KarigaiLogo({ size=22, color=KG.ink, mark=true, tagline=false }) {
  return (
    <div style={{ display:'inline-flex',alignItems:'center',gap:10 }}>
      {mark&&<KarigaiMark size={size*1.05} color={color}/>}
      <div style={{ display:'flex',flexDirection:'column',lineHeight:1 }}>
        <span style={{ fontFamily:KGFont.display,fontSize:size*1.45,fontWeight:400,color,letterSpacing:'-0.01em',fontStyle:'italic' }}>karigai</span>
        {tagline&&<span style={{ fontFamily:KGFont.mono,fontSize:9,color,opacity:0.55,letterSpacing:'0.18em',textTransform:'uppercase',marginTop:4 }}>wellness, attuned</span>}
      </div>
    </div>
  );
}

// ── Shared screen components ──────────────────────────────────
function TabBar({ active='home', dark, onTabChange }) {
  const items = [
    { id:'home',  icon:'home',     label:'Today' },
    { id:'cycle', icon:'cycle',    label:'Cycle' },
    { id:'meal',  icon:'meal',     label:'Meals' },
    { id:'move',  icon:'dumbbell', label:'Move' },
    { id:'me',    icon:'user',     label:'Me' },
  ];
  return (
    <div style={{
      height:84, paddingBottom:22,
      background: dark?'rgba(15,14,12,0.92)':'rgba(250,246,239,0.92)',
      backdropFilter:'blur(20px) saturate(180%)',
      WebkitBackdropFilter:'blur(20px) saturate(180%)',
      borderTop:`1px solid ${dark?KG.inkLine:KG.hairline}`,
      display:'flex',justifyContent:'space-around',alignItems:'center',
      flexShrink:0,
    }}>
      {items.map(it => {
        const on = it.id===active;
        const c = on?(dark?KG.cream:KG.ink):(dark?'#7A7066':KG.muted);
        return (
          <button key={it.id} onClick={()=>onTabChange&&onTabChange(it.id)}
            style={{ display:'flex',flexDirection:'column',alignItems:'center',gap:3,background:'none',border:'none',padding:'4px 8px' }}>
            <Icon d={Icons[it.icon]} color={c} size={22} sw={on?1.8:1.5}/>
            <span style={{ fontFamily:KGFont.body,fontSize:9.5,color:c,fontWeight:on?600:400,letterSpacing:'0.02em' }}>{it.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function ScreenHeader({ title, eyebrow, action, sub, dark }) {
  return (
    <div style={{ padding:'8px 22px 14px' }}>
      {eyebrow&&<KEyebrow>{eyebrow}</KEyebrow>}
      <div style={{ display:'flex',alignItems:'flex-end',justifyContent:'space-between',marginTop:6 }}>
        <div style={{ fontFamily:KGFont.display,fontSize:32,fontStyle:'italic',letterSpacing:'-0.02em',color:dark?KG.cream:KG.ink,lineHeight:1 }}>{title}</div>
        {action}
      </div>
      {sub&&<div style={{ fontFamily:KGFont.body,fontSize:12.5,color:dark?'#A99F92':KG.muted,marginTop:8,lineHeight:1.4 }}>{sub}</div>}
    </div>
  );
}

// ── Mobile screen 01 · Welcome ────────────────────────────────
function S_Welcome({ onNavigate }) {
  return (
    <div style={{ background:KG.cream,minHeight:844,display:'flex',flexDirection:'column',position:'relative',paddingTop:50 }}>
      <div style={{ flex:1,padding:'40px 30px 24px',display:'flex',flexDirection:'column',justifyContent:'space-between' }}>
        <KarigaiLogo size={20} tagline/>
        <div>
          <KEyebrow>est. 2026 · wellness, not medicine</KEyebrow>
          <div style={{ fontFamily:KGFont.display,fontSize:62,fontStyle:'italic',lineHeight:0.95,letterSpacing:'-0.02em',color:KG.ink,marginTop:14 }}>
            A quiet<br/>plan, made<br/>from <span style={{ color:KG.clay }}>you.</span>
          </div>
          <div style={{ fontFamily:KGFont.body,fontSize:14,color:KG.ink2,marginTop:18,maxWidth:300,lineHeight:1.5 }}>
            Cycle, fitness, nutrition and habits — gently personalized, never diagnostic.
          </div>
        </div>
      </div>
      <div style={{ padding:'20px 22px 36px',display:'flex',flexDirection:'column',gap:10 }}>
        <button onClick={()=>onNavigate('onboarding')}
          style={{ height:52,borderRadius:16,background:KG.ink,color:KG.cream,border:'none',fontFamily:KGFont.body,fontSize:15,fontWeight:500 }}>
          Begin
        </button>
        <button onClick={()=>onNavigate('today')}
          style={{ height:52,borderRadius:16,background:'transparent',color:KG.ink,border:'none',fontFamily:KGFont.body,fontSize:14 }}>
          I already have an account
        </button>
        <div style={{ fontFamily:KGFont.mono,fontSize:9,color:KG.muted,letterSpacing:'0.16em',textTransform:'uppercase',textAlign:'center',marginTop:6 }}>
          private by default · data stays yours
        </div>
      </div>
    </div>
  );
}

// ── Mobile screen 02 · Onboarding ────────────────────────────
function S_Onboarding({ onNavigate }) {
  const Toggle = ({ label, on, tone='neutral' }) => (
    <div style={{
      padding:'12px 14px',borderRadius:12,
      background:on?(tone==='clay'?'#F4DCCD':KG.ink):KG.card,
      color:on?(tone==='clay'?'#6E3D24':KG.cream):KG.ink2,
      border:`1px solid ${on?'transparent':KG.hairline}`,
      fontFamily:KGFont.body,fontSize:12.5,fontWeight:500,
      display:'flex',alignItems:'center',justifyContent:'space-between',
    }}>
      <span>{label}</span>
      {on&&<Icon d={Icons.check} size={14} color={tone==='clay'?'#6E3D24':KG.cream}/>}
    </div>
  );
  return (
    <div style={{ background:KG.paper,paddingTop:50,minHeight:844,fontFamily:KGFont.body }}>
      <div style={{ padding:'8px 22px 0' }}>
        <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18 }}>
          <button onClick={()=>onNavigate('welcome')} style={{ background:'none',border:'none',padding:0 }}>
            <Icon d={Icons.back} size={22}/>
          </button>
          <div style={{ fontFamily:KGFont.mono,fontSize:10,color:KG.muted,letterSpacing:'0.18em' }}>04 / 09</div>
          <button onClick={()=>onNavigate('analysis')} style={{ fontFamily:KGFont.body,fontSize:12,color:KG.muted,background:'none',border:'none' }}>Skip</button>
        </div>
        <div style={{ height:3,background:KG.hairline,borderRadius:99,overflow:'hidden',marginBottom:22 }}>
          <div style={{ width:'44%',height:'100%',background:KG.clay }}/>
        </div>
      </div>
      <div style={{ padding:'0 22px' }}>
        <KEyebrow>health context</KEyebrow>
        <div style={{ fontFamily:KGFont.display,fontSize:30,fontStyle:'italic',lineHeight:1.05,color:KG.ink,marginTop:8,letterSpacing:'-0.01em' }}>
          Anything we should know,<br/>so we plan more gently?
        </div>
        <div style={{ fontFamily:KGFont.body,fontSize:12.5,color:KG.muted,marginTop:10,lineHeight:1.45 }}>
          Self-reported only. We use this to adjust workouts and meals — never to diagnose.
        </div>
        <div style={{ marginTop:22 }}>
          <KEyebrow>self-reported conditions</KEyebrow>
          <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:10 }}>
            <Toggle label="PCOS" on tone="clay"/>
            <Toggle label="Thyroid"/>
            <Toggle label="Iron deficiency" on tone="clay"/>
            <Toggle label="Prediabetes"/>
            <Toggle label="Endometriosis"/>
            <Toggle label="None of these"/>
          </div>
        </div>
        <div style={{ marginTop:22 }}>
          <KEyebrow>life stage</KEyebrow>
          <div style={{ display:'flex',gap:8,marginTop:10,flexWrap:'wrap' }}>
            {['Cycling','Trying','Pregnant','Postpartum','Breastfeeding','Perimenopause'].map(t=>(
              <span key={t} style={{ padding:'8px 14px',borderRadius:99,border:`1px solid ${t==='Cycling'?KG.ink:KG.hairline}`,background:t==='Cycling'?KG.ink:'transparent',color:t==='Cycling'?KG.cream:KG.ink2,fontFamily:KGFont.body,fontSize:12,fontWeight:500 }}>{t}</span>
            ))}
          </div>
        </div>

function S_Cycle({ onNavigate }) {
  const days = [];
  for (let i=1; i<=28; i++) {
    let phase='follicular';
    if (i<=5) phase='menstrual';
    else if (i>=13&&i<=16) phase='ovulation';
    else if (i>=17) phase='luteal';
    days.push({ n:i, phase, period:i<=5, today:i===24 });
  }
  for (let i=29; i<=32; i++) days.push({ n:i, period:true, predicted:true });
  const colors = { menstrual:KG.alert, follicular:KG.claySoft, ovulation:KG.sage, luteal:KG.bone };
  const Day = ({ n, phase, today, period, predicted }) => {
    const bg = period?colors.menstrual:colors[phase]||'transparent';
    return (
      <div style={{ width:36,height:44,borderRadius:12,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:today?KG.ink:(predicted?'transparent':bg),border:predicted?`1px dashed ${KG.muted}`:'none',color:today?KG.cream:KG.ink2 }}>
        <span style={{ fontFamily:KGFont.body,fontSize:12,fontWeight:today?700:500 }}>{n}</span>
        {period&&!today&&<div style={{ width:4,height:4,borderRadius:99,background:KG.alert,marginTop:2 }}/>}

    );
  };
  const Symptom = ({ icon, label, on }) => (
    <div style={{ padding:'10px 12px',borderRadius:14,minWidth:84,background:on?'#F4DCCD':KG.card,border:`1px solid ${on?'transparent':KG.hairline}`,display:'flex',flexDirection:'column',alignItems:'center',gap:6 }}>

      <span style={{ fontFamily:KGFont.body,fontSize:11,color:on?'#6E3D24':KG.ink2,fontWeight:on?600:400 }}>{label}</span>
    </div>
  );
  return (
    <div style={{ background:KG.paper,paddingTop:50,fontFamily:KGFont.body }}>
      <ScreenHeader eyebrow="cycle" title="Day 24 · Luteal" sub="Estimated. Period likely 4–6 days. Confidence 72% — your cycle was irregular last month."

        <div style={{ display:'flex',gap:10,flexWrap:'wrap' }}>
          <KChip tone="alert">● Menstrual</KChip>
          <KChip tone="clay">● Follicular</KChip>
          <KChip tone="sage">● Ovulation</KChip>
          <KChip tone="bone">● Luteal</KChip>
          <KChip>◌ Predicted</KChip>
        </div>
        <KCard pad={16}>
          <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8 }}>
            <span style={{ fontFamily:KGFont.display,fontSize:18,fontStyle:'italic',color:KG.ink }}>April</span>
            <div style={{ fontFamily:KGFont.mono,fontSize:10,color:KG.muted,letterSpacing:'0.12em' }}>← →</div>

          <div style={{ display:'grid',gridTemplateColumns:'repeat(7, 1fr)',gap:4 }}>

// ── Admin: Sparkline ─────────────────────────────────────────
function Sparkline({ data, color=KG.clay, h=40 }) {
  const max=Math.max(...data), min=Math.min(...data);
  const w=160;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/(max-min||1))*h}`).join(' ');
  return (
    <svg width={w} height={h}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth={1.6} strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={w} cy={h-((data[data.length-1]-min)/(max-min||1))*h} r={2.5} fill={color}/>
    </svg>
  );
}

// ── Phone App wrapper ─────────────────────────────────────────
const MOBILE_SCREENS = {
  welcome:    { label:'Welcome',    comp: S_Welcome,    tab: null },
  onboarding: { label:'Onboarding', comp: S_Onboarding, tab: null },
  analysis:   { label:'Analysis',   comp: S_Analysis,   tab: null },
  today:      { label:'Today',      comp: S_Today,      tab: 'home' },
  cycle:      { label:'Cycle',      comp: S_Cycle,      tab: 'cycle' },
  meals:      { label:'Meals',      comp: S_Meals,      tab: 'meal' },
  workout:    { label:'Workout',    comp: S_Workout,    tab: 'move' },
  ai:         { label:'AI Chat',    comp: S_AIChat,     tab: 'me' },
  privacy:    { label:'Privacy',    comp: S_Privacy,    tab: 'me' },
};

const TAB_TO_SCREEN = { home:'today', cycle:'cycle', meal:'meals', move:'workout', me:'privacy' };

function PhoneApp({ screen, setScreen }) {
  const { comp: ScreenComp, tab } = MOBILE_SCREENS[screen] || MOBILE_SCREENS.today;
  return (
    <div className="phone-body" style={{ background: ['welcome','analysis','onboarding'].includes(screen) ? KG.cream : KG.paper }}>
      <div className="screen-scroll">
        <ScreenComp onNavigate={setScreen}/>
      </div>
      {tab && (
        <TabBar active={tab} onTabChange={(t) => setScreen(TAB_TO_SCREEN[t] || 'today')}/>
      )}
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────
function App() {
  const [mode, setMode] = useState('app');
  const [screen, setScreen] = useState('welcome');
  const [adminScreen, setAdminScreen] = useState('admin-overview');

  const navigate = (s) => {
    if (s && s.startsWith('admin-')) {
      setMode('admin');
      setAdminScreen(s);
    } else if (s) {
      setMode('app');
      setScreen(s);
    }
  };

  const mobileScreenKeys = Object.keys(MOBILE_SCREENS);

  return (
    <div className="app-wrapper">
      {/* Site header */}
      <header className="site-header">
        <KarigaiLogo size={17} tagline/>
        <nav className="nav-pills">
          <button className={`nav-pill${mode==='app'?' on':''}`} onClick={()=>setMode('app')}>App preview</button>
          <button className={`nav-pill${mode==='admin'?' on':''}`} onClick={()=>{ setMode('admin'); setAdminScreen('admin-overview'); }}>Admin preview</button>
        </nav>
        <div style={{ fontFamily: KGFont.mono, fontSize: 10, color: KG.muted, letterSpacing: '0.14em', textTransform: 'uppercase' }}>v 0.1 · 2026</div>
      </header>

      {mode === 'app' && (
        <>
          {/* Screen selector */}
          <div className="screen-selector">
            {mobileScreenKeys.map(k => (
              <button key={k} className={`screen-pill${screen===k?' on':''}`} onClick={()=>setScreen(k)}>
                {MOBILE_SCREENS[k].label}
              </button>
            ))}
          </div>
          {/* Phone stage */}
          <div className="phone-stage">
            <div className="phone-shell">
              <PhoneApp screen={screen} setScreen={navigate}/>
            </div>
          </div>
        </>
      )}

      {mode === 'admin' && (
        <div className="admin-view">
          {/* Admin screen selector */}
          <div style={{ padding:'14px 24px 0', display:'flex', gap:6 }}>
            {[
              { id:'admin-overview', label:'Overview' },
              { id:'admin-rules',    label:'Rule manager' },
              { id:'admin-ai',       label:'AI review' },
            ].map(s=>(
              <button key={s.id} className={`screen-pill${adminScreen===s.id?' on':''}`} onClick={()=>setAdminScreen(s.id)}>
                {s.label}
              </button>
            ))}
          </div>
          <div style={{ padding:'16px 0 0' }}>
            {adminScreen === 'admin-overview' && <A_Overview onNavigate={navigate}/>}
            {adminScreen === 'admin-rules'    && <A_Rules    onNavigate={navigate}/>}
            {adminScreen === 'admin-ai'       && <A_AIReview onNavigate={navigate}/>}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
